<!DOCTYPE html>
<html>
<head>
  <title>Auto-Generate All Icons (ONE CLICK)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #4285F4;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #5f6368;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .big-button {
      background: linear-gradient(135deg, #4285F4 0%, #34A853 100%);
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 20px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
      transition: all 0.3s;
      margin-bottom: 20px;
    }
    .big-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(66, 133, 244, 0.6);
    }
    .big-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      background: #E8F0FE;
      border-radius: 8px;
      display: none;
    }
    .status.show {
      display: block;
    }
    .success {
      background: #E6F4EA;
      color: #137333;
      border-left: 4px solid #34A853;
    }
    .preview {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      justify-content: center;
      align-items: center;
    }
    canvas {
      border: 2px solid #e8eaed;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .instructions {
      background: #FFF3CD;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      border-left: 4px solid #FFC107;
      font-size: 14px;
      line-height: 1.6;
    }
    .step {
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-number {
      background: #4285F4;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Auto Icon Generator</h1>
    <div class="subtitle">Generate all 3 required icons with ONE click</div>

    <button class="big-button" onclick="generateAndDownloadAll()">
      ⚡ Generate All Icons Now
    </button>

    <div class="instructions">
      <strong>📋 What This Does:</strong>
      <div class="step">
        <div class="step-number">1</div>
        <div>Creates icon16.png, icon48.png, icon128.png</div>
      </div>
      <div class="step">
        <div class="step-number">2</div>
        <div>Auto-downloads all 3 files to your Downloads folder</div>
      </div>
      <div class="step">
        <div class="step-number">3</div>
        <div>Move the 3 PNG files to your extension folder</div>
      </div>
      <div class="step">
        <div class="step-number">4</div>
        <div>Done! ✅ Extension ready to load</div>
      </div>
    </div>

    <div class="preview" id="preview"></div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const iconSVG = `
      <svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#34A853;stop-opacity:1" />
          </linearGradient>
        </defs>
        <circle cx="64" cy="64" r="60" fill="url(#grad)"/>
        <path d="M74.67 32H42.67C39.35 32 36.67 34.68 36.67 38V90C36.67 93.32 39.35 96 42.67 96H85.33C88.65 96 91.33 93.32 91.33 90V48L74.67 32Z" fill="white"/>
        <path d="M74.67 32V48H91.33" fill="#A1C2FA"/>
        <rect x="48" y="58" width="32" height="3" rx="1.5" fill="#4285F4"/>
        <rect x="48" y="66" width="32" height="3" rx="1.5" fill="#4285F4"/>
        <rect x="48" y="74" width="24" height="3" rx="1.5" fill="#4285F4"/>
        <rect x="48" y="82" width="28" height="3" rx="1.5" fill="#4285F4"/>
      </svg>
    `;

    async function generateIcon(size) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        const blob = new Blob([iconSVG], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);

        img.onload = function() {
          ctx.drawImage(img, 0, 0, size, size);
          URL.revokeObjectURL(url);
          resolve(canvas);
        };

        img.src = url;
      });
    }

    function downloadCanvas(canvas, filename) {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    async function generateAndDownloadAll() {
      const button = event.target;
      const status = document.getElementById('status');
      const preview = document.getElementById('preview');

      button.disabled = true;
      button.textContent = '⏳ Generating...';

      preview.innerHTML = '';
      status.className = 'status show';
      status.innerHTML = 'Creating icons...';

      try {
        const sizes = [16, 48, 128];

        for (const size of sizes) {
          const canvas = await generateIcon(size);

          // Show preview
          const previewCanvas = canvas.cloneNode(true);
          preview.appendChild(previewCanvas);

          // Download
          downloadCanvas(canvas, `icon${size}.png`);

          await new Promise(resolve => setTimeout(resolve, 300));
        }

        status.className = 'status show success';
        status.innerHTML = `
          ✅ <strong>Success!</strong> All 3 icons downloaded!<br><br>
          <strong>Next step:</strong> Check your Downloads folder for:<br>
          • icon16.png<br>
          • icon48.png<br>
          • icon128.png<br><br>
          Move these 3 files to your extension folder, then follow SETUP-SIMPLE.md
        `;

        button.textContent = '✓ Generated! (Click to regenerate)';
        button.disabled = false;

      } catch (error) {
        status.className = 'status show';
        status.style.background = '#FCE8E6';
        status.style.color = '#D93025';
        status.innerHTML = `❌ Error: ${error.message}`;

        button.textContent = '⚡ Generate All Icons Now';
        button.disabled = false;
      }
    }

    // Auto-generate on page load for preview
    window.onload = async () => {
      const preview = document.getElementById('preview');
      const sizes = [16, 48, 128];

      for (const size of sizes) {
        const canvas = await generateIcon(size);
        const container = document.createElement('div');
        container.style.textAlign = 'center';

        const label = document.createElement('div');
        label.textContent = `${size}x${size}`;
        label.style.fontSize = '12px';
        label.style.color = '#5f6368';
        label.style.marginTop = '5px';

        container.appendChild(canvas);
        container.appendChild(label);
        preview.appendChild(container);
      }
    };
  </script>
</body>
</html>
